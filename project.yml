name: CountEmBlessingz
options:
  bundleIdPrefix: com.clemzzz
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  CountEmBlessingz:
    type: application
    platform: iOS
    sources:
      - CountEmBlessingz
    info:
      path: CountEmBlessingz/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.clemzzz.countemblessingz.exchange
            UTTypeDescription: Count 'Em Blessingz file
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - blessingz
        LSSupportsOpeningDocumentsInPlace: false   # imports are copied and reviewed, never edited in place
        ITSAppUsesNonExemptEncryption: false       # no custom encryption: skips the export-compliance question
        CFBundleDocumentTypes:
          - CFBundleTypeName: Count 'Em Blessingz file
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.clemzzz.countemblessingz.exchange
        UIAppFonts:
          - PlayfairDisplay-Medium.ttf
          - PlayfairDisplay-Bold.ttf
          - Montserrat-Regular.ttf
          - Montserrat-Medium.ttf
          - Montserrat-SemiBold.ttf
          - Jost-Regular.ttf
          - Jost-Medium.ttf
          - Jost-Bold.ttf
          - Jost-ExtraBold.ttf
          - CormorantGaramond-Medium.ttf
          - CormorantGaramond-SemiBold.ttf
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
    entitlements:
      path: CountEmBlessingz/CountEmBlessingz.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.clemzzz.countemblessingz
    dependencies:
      - target: CountEmBlessingzWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clemzzz.countemblessingz
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only; XcodeGen's per-target default "1,2" would override the project-wide value
        DEVELOPMENT_TEAM: 8FXKW2Z58P
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        INFOPLIST_KEY_CFBundleDisplayName: "Count 'Em Blessingz"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Count 'Em Blessingz uses Face ID to keep your blessings private. You can also unlock with your passcode."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  CountEmBlessingzWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CountEmBlessingzWidget
      - path: CountEmBlessingz/Models
      - path: CountEmBlessingz/Theme/AppTheme.swift
      - path: CountEmBlessingz/Theme/Themes.swift
      - path: CountEmBlessingz/Theme/Fonts.swift
      - path: CountEmBlessingz/Services/MoneyFormatter.swift
    info:
      path: CountEmBlessingzWidget/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Honeypot
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: CountEmBlessingzWidget/CountEmBlessingzWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.clemzzz.countemblessingz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clemzzz.countemblessingz.widget
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only; XcodeGen's per-target default "1,2" would override the project-wide value
        DEVELOPMENT_TEAM: 8FXKW2Z58P
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        SKIP_INSTALL: YES
  CountEmBlessingzUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - CountEmBlessingzUITests
    dependencies:
      - target: CountEmBlessingz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clemzzz.countemblessingz.uitests
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only; XcodeGen's per-target default "1,2" would override the project-wide value
        GENERATE_INFOPLIST_FILE: YES
  CountEmBlessingzTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CountEmBlessingzTests
    dependencies:
      - target: CountEmBlessingz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clemzzz.countemblessingz.tests
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only; XcodeGen's per-target default "1,2" would override the project-wide value
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CountEmBlessingz:
    build:
      targets:
        CountEmBlessingz: all
        CountEmBlessingzWidget: all
    test:
      targets:
        - CountEmBlessingzTests
  CountEmBlessingzUI:
    build:
      targets:
        CountEmBlessingz: all
    test:
      targets:
        - CountEmBlessingzUITests
