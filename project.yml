name: CountEmBlessingz
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  CountEmBlessingz:
    type: application
    platform: iOS
    sources:
      - CountEmBlessingz
    info:
      path: CountEmBlessingz/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIAppFonts:
          - PlayfairDisplay-Medium.ttf
          - PlayfairDisplay-Bold.ttf
          - Montserrat-Regular.ttf
          - Montserrat-Medium.ttf
          - Montserrat-SemiBold.ttf
          - Jost-Regular.ttf
          - Jost-Medium.ttf
          - Jost-Bold.ttf
          - Jost-ExtraBold.ttf
          - CormorantGaramond-Medium.ttf
          - CormorantGaramond-SemiBold.ttf
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
    entitlements:
      path: CountEmBlessingz/CountEmBlessingz.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.countemblessingz
    dependencies:
      - target: CountEmBlessingzWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.countemblessingz
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: "Count 'Em Blessingz"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Unlock your honeypot"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  CountEmBlessingzWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CountEmBlessingzWidget
      - path: CountEmBlessingz/Models
      - path: CountEmBlessingz/Theme/AppTheme.swift
      - path: CountEmBlessingz/Theme/Themes.swift
      - path: CountEmBlessingz/Theme/Fonts.swift
      - path: CountEmBlessingz/Services/MoneyFormatter.swift
    info:
      path: CountEmBlessingzWidget/Info.plist
      properties:
        CFBundleDisplayName: Honeypot
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: CountEmBlessingzWidget/CountEmBlessingzWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.countemblessingz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.countemblessingz.widget
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES
  CountEmBlessingzTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CountEmBlessingzTests
    dependencies:
      - target: CountEmBlessingz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.countemblessingz.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CountEmBlessingz:
    build:
      targets:
        CountEmBlessingz: all
        CountEmBlessingzWidget: all
    test:
      targets:
        - CountEmBlessingzTests
